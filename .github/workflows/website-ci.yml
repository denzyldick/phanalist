name: Website CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Check formatting (Prettier)
        working-directory: website
        run: npm run format:check

      - name: Lint (ESLint)
        working-directory: website
        run: npm run lint

      - name: Lint HTML (HTMLHint)
        working-directory: website
        run: npm run htmlhint

      - name: Build (Vite)
        working-directory: website
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist/
          retention-days: 7

  deploy-github-pages:
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build for GitHub Pages
        working-directory: website
        env:
          BASE_PATH: /phanalist/
          SITE_URL: https://denzyl.github.io/phanalist
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


