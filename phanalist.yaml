enabled_rules: []
disable_rules: []
rules:
  E0009:
    max_complexity: 10
  E0010:
    max_paths: 200
  E0007:
    check_constructor: true
    max_parameters: 8
  E0012:
    exclude_namespaces: []
    include_namespaces:
    - App\Service\
    - App\Controller\
    reset_interfaces:
    - ResetInterface
  E0024:
    max_loc: 50
  E0025:
    max_loc: 500
  E0026:
    min_ratio: 0.05
    max_ratio: 0.5
  E0027:
    max_methods: 15
    max_fields: 10
  E0028:
    max_getter_setter_ratio: 0.7
    min_methods: 3
  E0029:
    max_fan_out: 10
    max_fan_in: 20
  E0030:
    max_density: 0.3
  E0031:
    php_version: "8.4"
    check_division: true
    check_modulo: true
    check_intdiv: true
    check_array_index: true
    check_string_offset: true
    check_nullability: true
    check_types: true
    check_assertions: true
    check_unreachable: true
    check_return_contracts: true
    loop_strategy: auto
    unroll_depth: 16
    timeout_ms: 1000
    unknown_policy: report
    max_findings_per_function: 50
